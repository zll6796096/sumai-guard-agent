name: Submit Cloud Run candidates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sumai-cloudrun-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate-only paired Cloud Build
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      SUMAI_FIREBASE_APP_ID: ${{ vars.SUMAI_FIREBASE_APP_ID }}
      SUMAI_AGENT_SERVICE_ACCOUNT: ${{ vars.SUMAI_AGENT_SERVICE_ACCOUNT }}
      SUMAI_WEB_SERVICE_ACCOUNT: ${{ vars.SUMAI_WEB_SERVICE_ACCOUNT }}
      SUMAI_EXPECTED_AGENT_PREDECESSOR_SERVICE_ACCOUNT: ${{ vars.SUMAI_EXPECTED_AGENT_PREDECESSOR_SERVICE_ACCOUNT }}
      SUMAI_EXPECTED_WEB_PREDECESSOR_SERVICE_ACCOUNT: ${{ vars.SUMAI_EXPECTED_WEB_PREDECESSOR_SERVICE_ACCOUNT }}
      SUMAI_SERVICE_ACCOUNT_MIGRATION_CONFIRM: ${{ vars.SUMAI_SERVICE_ACCOUNT_MIGRATION_CONFIRM }}
      SUMAI_REGION: ${{ vars.SUMAI_REGION || 'asia-northeast1' }}
      SUMAI_AR_REPO: ${{ vars.SUMAI_AR_REPO || 'apps' }}
      SUMAI_AGENT_SERVICE: ${{ vars.SUMAI_AGENT_SERVICE || 'sumai-agent' }}
      SUMAI_WEB_SERVICE: ${{ vars.SUMAI_WEB_SERVICE || 'sumai-web' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Check required repository configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GOOGLE_CLOUD_PROJECT" ]] || { echo "GOOGLE_CLOUD_PROJECT is required" >&2; exit 1; }
          [[ -n "$SUMAI_FIREBASE_APP_ID" ]] || { echo "SUMAI_FIREBASE_APP_ID is required" >&2; exit 1; }
          [[ -n "$SUMAI_AGENT_SERVICE_ACCOUNT" ]] || { echo "SUMAI_AGENT_SERVICE_ACCOUNT is required" >&2; exit 1; }
          [[ -n "$SUMAI_WEB_SERVICE_ACCOUNT" ]] || { echo "SUMAI_WEB_SERVICE_ACCOUNT is required" >&2; exit 1; }
          [[ -n "$SUMAI_EXPECTED_AGENT_PREDECESSOR_SERVICE_ACCOUNT" ]] || { echo "SUMAI_EXPECTED_AGENT_PREDECESSOR_SERVICE_ACCOUNT is required" >&2; exit 1; }
          [[ -n "$SUMAI_EXPECTED_WEB_PREDECESSOR_SERVICE_ACCOUNT" ]] || { echo "SUMAI_EXPECTED_WEB_PREDECESSOR_SERVICE_ACCOUNT is required" >&2; exit 1; }
          [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]] || { echo "GCP_WORKLOAD_IDENTITY_PROVIDER is required" >&2; exit 1; }
          [[ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" ]] || { echo "GCP_DEPLOY_SERVICE_ACCOUNT is required" >&2; exit 1; }

      - name: Check out exact main revision
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify workflow revision is main HEAD
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Dispatch must target main" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Workflow SHA is not main HEAD" >&2; exit 1; }

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Submit cloudbuild.yaml candidate-only paired build
        shell: bash
        run: ./scripts/deploy_all_cloudrun.sh
