name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r apps/sumai_agent/requirements.txt

      - name: Install frontend dependencies
        run: pip install -r apps/sumai_web/requirements.txt

      - name: Run backend tests
        run: python -m pytest apps/sumai_agent/tests -v

      - name: Validate release control contracts
        run: |
          python scripts/test_cloudbuild_config.py
          python -m pytest scripts/test_promote_verified_candidate.py scripts/test_deployment_entrypoints.py -v
          bash -n scripts/promote-verified-candidate.sh scripts/check_cloudrun.sh scripts/deploy_all_cloudrun.sh scripts/deploy_sumai_agent.sh scripts/deploy_sumai_web.sh

      - name: Frontend import check
        run: |
          python -c "
          import importlib.util
          from pathlib import Path
          path = Path('apps/sumai_web/app.py')
          spec = importlib.util.spec_from_file_location('sumai_web_app', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          print('frontend import ok')
          "

      - name: Validate docker compose config
        run: docker compose config
