<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">SumaiGuard Agent system architecture</title>
  <desc id="desc">A two-row flow from browser and two Cloud Run services through image sanitization, Gemini 2.5 Flash, Pydantic validation, deterministic rules, and red-box reports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D42"/>
      <stop offset="0.38" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#251954"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      text { font-family: "Yu Gothic", "Hiragino Sans", sans-serif; }
      .white { fill: #F7F9FC; }
      .muted { fill: #AEBBD3; }
      .card { fill: #19233E; stroke: #354A75; stroke-width: 2; }
      .step { font-size: 24px; font-weight: 700; }
      .card-title { font-size: 28px; font-weight: 700; }
      .card-sub { font-size: 18px; font-weight: 500; }
      .pill { fill: #243252; }
      .pill-text { font-size: 18px; font-weight: 700; }
      .lane { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; }
      .flow { fill: none; stroke: #64759A; stroke-width: 6; }
      .arrowhead { fill: #64759A; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>

  <rect x="96" y="62" width="240" height="42" rx="21" fill="#4C7DFF"/>
  <text x="116" y="91" class="white" font-size="18" font-weight="700">SYSTEM ARCHITECTURE</text>
  <text x="96" y="178" class="white" font-size="52" font-weight="700">SumaiGuard Agent</text>
  <text x="96" y="220" class="muted" font-size="23">1枚の写真から、見える危険と次の行動を整理</text>

  <rect x="1363" y="78" width="461" height="111" rx="26" fill="#151D33" stroke="#354A75" stroke-width="2"/>
  <text x="1392" y="118" fill="#39C58A" font-size="20" font-weight="700">設計原則</text>
  <text x="1392" y="155" class="white" font-size="20">AIの抽出 と 行動ポリシーを分離</text>

  <rect x="96" y="264" width="192" height="34" rx="17" fill="#1E2A49"/>
  <text x="112" y="287" fill="#4C7DFF" class="lane">REQUEST / CLOUD</text>
  <rect x="96" y="629" width="230" height="34" rx="17" fill="#1E2A49"/>
  <text x="112" y="652" fill="#806BFF" class="lane">AI / SAFETY POLICY</text>

  <!-- 01 Browser -->
  <g filter="url(#shadow)">
    <rect x="96" y="310" width="314" height="230" rx="30" class="card"/>
    <rect x="96" y="340" width="6" height="170" fill="#4C7DFF"/>
    <circle cx="146" cy="362" r="24" fill="#4C7DFF"/>
    <text x="146" y="370" text-anchor="middle" class="white step">01</text>
    <rect x="188" y="342" width="108" height="40" rx="20" class="pill"/>
    <text x="203" y="369" fill="#4C7DFF" class="pill-text">Browser</text>
    <text x="124" y="448" class="white card-title">写真を1枚入力</text>
    <text x="124" y="493" class="muted card-sub">日本語UI</text>
  </g>

  <!-- 02 sumai-web -->
  <g filter="url(#shadow)">
    <rect x="506" y="310" width="314" height="230" rx="30" class="card"/>
    <rect x="506" y="340" width="6" height="170" fill="#34B3C8"/>
    <circle cx="556" cy="362" r="24" fill="#34B3C8"/>
    <text x="556" y="370" text-anchor="middle" class="white step">02</text>
    <rect x="598" y="342" width="126" height="40" rx="20" class="pill"/>
    <text x="613" y="369" fill="#34B3C8" class="pill-text">Cloud Run</text>
    <text x="534" y="448" class="white card-title">sumai-web</text>
    <text x="534" y="493" class="muted card-sub">FastAPI + HTML/JavaScript</text>
  </g>

  <!-- 03 sumai-agent -->
  <g filter="url(#shadow)">
    <rect x="916" y="310" width="314" height="230" rx="30" class="card"/>
    <rect x="916" y="340" width="6" height="170" fill="#34B3C8"/>
    <circle cx="966" cy="362" r="24" fill="#34B3C8"/>
    <text x="966" y="370" text-anchor="middle" class="white step">03</text>
    <rect x="1008" y="342" width="126" height="40" rx="20" class="pill"/>
    <text x="1023" y="369" fill="#34B3C8" class="pill-text">Cloud Run</text>
    <text x="944" y="448" class="white card-title">sumai-agent</text>
    <text x="944" y="493" class="muted card-sub">FastAPI</text>
  </g>

  <!-- 04 image intake -->
  <g filter="url(#shadow)">
    <rect x="1326" y="310" width="314" height="230" rx="30" class="card"/>
    <rect x="1326" y="340" width="6" height="170" fill="#39C58A"/>
    <circle cx="1376" cy="362" r="24" fill="#39C58A"/>
    <text x="1376" y="370" text-anchor="middle" class="white step">04</text>
    <rect x="1418" y="342" width="152" height="40" rx="20" class="pill"/>
    <text x="1433" y="369" fill="#39C58A" class="pill-text">Image intake</text>
    <text x="1354" y="448" class="white card-title">EXIF除去・リサイズ</text>
    <text x="1354" y="493" class="muted card-sub">メモリ内処理</text>
  </g>

  <!-- 05 Gemini -->
  <g filter="url(#shadow)">
    <rect x="1326" y="675" width="314" height="230" rx="30" class="card"/>
    <rect x="1326" y="705" width="6" height="170" fill="#806BFF"/>
    <circle cx="1376" cy="727" r="24" fill="#806BFF"/>
    <text x="1376" y="735" text-anchor="middle" class="white step">05</text>
    <rect x="1418" y="707" width="190" height="40" rx="20" class="pill"/>
    <text x="1433" y="734" fill="#806BFF" class="pill-text">Gemini 2.5 Flash</text>
    <text x="1354" y="813" class="white card-title">見える危険候補を抽出</text>
    <text x="1354" y="858" class="muted card-sub">転倒・滑り・つまずき</text>
  </g>

  <!-- 06 Pydantic -->
  <g filter="url(#shadow)">
    <rect x="916" y="675" width="314" height="230" rx="30" class="card"/>
    <rect x="916" y="705" width="6" height="170" fill="#39C58A"/>
    <circle cx="966" cy="727" r="24" fill="#39C58A"/>
    <text x="966" y="735" text-anchor="middle" class="white step">06</text>
    <rect x="1008" y="707" width="116" height="40" rx="20" class="pill"/>
    <text x="1023" y="734" fill="#39C58A" class="pill-text">Pydantic</text>
    <text x="944" y="813" class="white card-title">JSONスキーマ検証</text>
    <text x="944" y="858" class="muted card-sub">型・値の範囲を検証</text>
  </g>

  <!-- 07 Deterministic rules -->
  <g filter="url(#shadow)">
    <rect x="506" y="675" width="314" height="230" rx="30" class="card"/>
    <rect x="506" y="705" width="6" height="170" fill="#FFB547"/>
    <circle cx="556" cy="727" r="24" fill="#FFB547"/>
    <text x="556" y="735" text-anchor="middle" class="white step">07</text>
    <rect x="598" y="707" width="207" height="40" rx="20" class="pill"/>
    <text x="613" y="734" fill="#FFB547" class="pill-text">Deterministic rules</text>
    <text x="534" y="813" class="white card-title">3段階の行動に分類</text>
    <text x="534" y="858" class="muted card-sub">AIは区分を上書きしない</text>
  </g>

  <!-- 08 Output -->
  <g filter="url(#shadow)">
    <rect x="96" y="675" width="314" height="230" rx="30" class="card"/>
    <rect x="96" y="705" width="6" height="170" fill="#FF6478"/>
    <circle cx="146" cy="727" r="24" fill="#FF6478"/>
    <text x="146" y="735" text-anchor="middle" class="white step">08</text>
    <rect x="188" y="707" width="102" height="40" rx="20" class="pill"/>
    <text x="203" y="734" fill="#FF6478" class="pill-text">Output</text>
    <text x="124" y="813" class="white card-title">赤枠画像・レポート</text>
    <text x="124" y="858" class="muted card-sub">慎重な根拠説明</text>
  </g>

  <path d="M410 425 H474" class="flow"/><path d="M492 425 L474 414 L474 436 Z" class="arrowhead"/>
  <path d="M820 425 H884" class="flow"/><path d="M902 425 L884 414 L884 436 Z" class="arrowhead"/>
  <path d="M1230 425 H1294" class="flow"/><path d="M1312 425 L1294 414 L1294 436 Z" class="arrowhead"/>
  <path d="M1483 540 V643" class="flow"/><path d="M1483 661 L1472 643 L1494 643 Z" class="arrowhead"/>
  <path d="M1326 790 H1262" class="flow"/><path d="M1244 790 L1262 779 L1262 801 Z" class="arrowhead"/>
  <path d="M916 790 H852" class="flow"/><path d="M834 790 L852 779 L852 801 Z" class="arrowhead"/>
  <path d="M506 790 H442" class="flow"/><path d="M424 790 L442 779 L442 801 Z" class="arrowhead"/>

  <line x1="96" y1="949" x2="1824" y2="949" stroke="#2E3D60" stroke-width="2"/>
  <circle cx="104" cy="985" r="8" fill="#4C7DFF"/><text x="124" y="992" class="muted" font-size="17">入力/UI</text>
  <circle cx="289" cy="985" r="8" fill="#806BFF"/><text x="309" y="992" class="muted" font-size="17">生成AI</text>
  <circle cx="474" cy="985" r="8" fill="#39C58A"/><text x="494" y="992" class="muted" font-size="17">安全検証</text>
  <circle cx="659" cy="985" r="8" fill="#FFB547"/><text x="679" y="992" class="muted" font-size="17">決定論ポリシー</text>
  <circle cx="904" cy="985" r="8" fill="#FF6478"/><text x="924" y="992" class="muted" font-size="17">利用者への出力</text>
  <text x="1245" y="992" class="muted" font-size="17">画像はアプリ内に永続保存しない</text>
  <text x="1245" y="1028" class="muted" font-size="17">医療・介護・保険・施工判断を代替しない</text>
  <text x="96" y="1049" fill="#6F82AA" font-size="17">Google Cloud Run × Gemini 2.5 Flash</text>
</svg>
