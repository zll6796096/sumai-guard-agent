services:
  sumai-agent:
    build:
      context: ./apps/sumai_agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  sumai-web:
    build:
      context: ./apps/sumai_web
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SUMAI_AGENT_URL: http://sumai-agent:8080
      SUMAI_WEB_PORT: "8080"
      MOCK_MODE: ${MOCK_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - sumai-agent
    restart: unless-stopped
